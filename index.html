<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4B4B">
<link rel="manifest" href="manifest.webmanifest">

<title>Luotea Asemakierto</title>
<!--
  Luotea Asemakierto – asemanhoidon tarkastuskäynti puhelimella (KH ja alihankkija, n. 6 käyntiä / asema / vuosi).
  Sisarsovellus Kohdekierrolle: sama ulkoasu, sanelu, muistio ja kuvat. Tiedot pysyvät laitteella.
  Toimintamalli:
    - Puhelin muistaa kävijän asemat ja jokaisen aseman viimeisimmän käynnin (ilman kuvia).
    - Uusi käynti tuo edellisen käynnin avoimet poikkeamat listaksi: Korjattu / Ennallaan / Pahentunut.
    - Tarkastuskohdat: Kunnossa / Poikkeama / Korjattu paikalla. Tyhjä = ei tarkastettu. Ei pakollisia kenttiä.
    - Osiot näytetään vuodenajan mukaan (päivämäärästä), muut saa auki käsin.
    - 📤 Lähetä käynti: JSON-tiedosto (käynti + kuvat) puhelimen jakovalikolla sähköpostiin / Teamsiin.
      Sama tiedosto avautuu toisella puhelimella (sijainen) ja myöhemmin lukijassa.
  Julkinen repo: asemalistaa, osoitteita tai sopimustietoja EI kirjoiteta koodiin. Asemat lisätään puhelimessa
  tai tuodaan erillisestä tiedostosta (JSON tai CSV).
  (261110.1) Build 1: alusta. Tarkastuskohdat (OSIOT) ovat LUONNOS, korvataan Juntsan selvittämillä kohteilla.
  (261110.2) Build 2: kuva ja sanelu näkyvät jokaisen kohdan rivillä (ennen vasta Poikkeama-valinnan jälkeen).
             Kohdan kuvat näkyvät pikkukuvina kohdan alla. Kuvan voi siirtää toiseen kohtaan kuvaa napauttamalla.
             Vertailukuvat: avoimen poikkeaman kuvat säilyvät puhelimessa käynnin jälkeen (alkuperäinen + viimeisin)
             ja näkyvät seuraavalla käynnillä rinnakkain uuden kuvan kanssa. Lähetys sisältää vertailukuvat (historia: true),
             ja Avaa käynti tiedostosta tuo ne sijaisen puhelimeen.
-->
<style>
:root{--havu:#0F4B4B;--havu-dk:#093838;--kalkki:#E6DCD2;--kalkki-lt:#F5F0EA;--kalkki-md:#EFE7DD;--luumu:#371E30;--hiili:#1F1F1F;
--celadon:#96E6AA;--mulberry:#AA4678;--mut:#5A4655;--raja:#D9CFC4;--ok:#1E6B45;--ok-bg:#E3F4E8;--pk:#A3242E;--pk-bg:#FBE9EA;--kj:#7A5A00;--kj-bg:#FFF4D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--hiili);background:var(--kalkki-lt);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--havu);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}
header .ala{font-size:12px;opacity:.8}
header a.ohje{margin-left:auto;color:var(--celadon);font-weight:700;text-decoration:none;font-size:14px;padding:8px 4px}
header .build{font-size:11px;opacity:.7;text-align:right;margin-left:6px}
main{max-width:760px;margin:0 auto;padding:12px 12px 24px}
.kortti{background:#fff;border:1px solid var(--raja);border-radius:14px;padding:14px;margin-bottom:12px}
.kortti>h2{font-size:16px;margin:0 0 10px;color:var(--havu)}
.kentat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.kentat{grid-template-columns:1fr}}
label.k{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--raja);border-radius:10px;padding:10px 11px;background:#fff;color:var(--hiili);width:100%;min-height:48px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--celadon);outline-offset:1px;border-color:var(--havu)}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:48px}
button:focus-visible{outline:3px solid var(--celadon);outline-offset:2px}
button.p{background:var(--havu);color:#fff;border:none;padding:10px 16px;font-weight:650}
button.s{background:#fff;color:var(--havu);border:1px solid var(--havu);padding:9px 14px;font-weight:600}
button.l{background:none;border:1px dashed var(--havu);color:var(--havu);padding:9px 14px;width:100%;font-weight:600}
button.v{background:#fff;color:var(--mulberry);border:1px solid var(--mulberry);padding:9px 14px;font-weight:600}
.napit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.napit button{flex:1 1 auto}
.mut{color:var(--mut);font-size:13px}
.info{background:#EAF3F1;border-left:4px solid var(--havu);padding:9px 11px;border-radius:8px;font-size:14px;color:#24403F;margin:8px 0}
.varo{background:#FBEFF4;border-left:4px solid var(--mulberry);padding:9px 11px;border-radius:8px;font-size:14px;margin:8px 0}
/* asemalista */
.asema{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--kalkki)}
.asema:first-of-type{border-top:none}
.asema .nm{font-weight:700;font-size:16px}
.asema .tiedot{font-size:13px;color:var(--mut)}
.asema .avoin{display:inline-block;background:var(--pk-bg);color:var(--pk);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:4px}
.asema .rivi2{grid-column:1/-1;display:flex;gap:8px}
.asema .rivi2 button{flex:1}
.haku{margin-bottom:6px}
/* käynti */
.kayntiOts{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.kayntiOts h2{margin:0;font-size:20px;color:var(--havu)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:76px;background:#fff;border:1px solid var(--raja);color:var(--hiili);padding:8px 6px;font-weight:600;font-size:15px}
.seg button.on{background:var(--havu);color:#fff;border-color:var(--havu)}
details.osio{background:#fff;border:1px solid var(--raja);border-radius:14px;margin-bottom:12px;overflow:hidden}
details.osio>summary{list-style:none;cursor:pointer;padding:14px;background:var(--kalkki-md);display:flex;align-items:center;gap:10px;font-weight:700;color:var(--havu);min-height:52px}
details.osio>summary::-webkit-details-marker{display:none}
details.osio>summary .tila{margin-left:auto;font-size:13px;font-weight:600;color:var(--mut);text-align:right}
details.osio>summary .tila b{color:var(--pk)}
details.osio.kausiOff>summary{background:#fff;color:var(--mut)}
.nuoli{transition:transform .15s;display:inline-block;width:14px}
details[open]>summary .nuoli{transform:rotate(90deg)}
.sis{padding:12px 14px 14px}
.kohta{padding:10px 0;border-top:1px solid var(--kalkki)}
.kohta:first-child{border-top:none;padding-top:0}
.kohta .nm{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.kohta .nm .nt{flex:1;min-width:0}
.kohta .nm button.ik{flex:0 0 48px;width:48px;height:48px;min-height:48px;padding:0;font-size:20px;background:#fff;border:1px solid var(--havu);color:var(--havu)}
.kt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kt:empty{display:none}
.kt img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--raja);cursor:pointer;display:block}
.kt .vl{font-size:12px;color:var(--mut);width:100%;margin-top:2px}
.vert{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vert>div{min-width:0}
.vert .ots{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.vert img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--raja);cursor:pointer;display:block;margin-bottom:4px}
.vert .tyhja{font-size:12px;color:var(--mut);border:1px dashed var(--raja);border-radius:8px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.kohta .nm .kk{font-weight:600;font-size:12px;color:var(--mut);margin-left:6px}
.tilat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tilat button{background:#fff;border:1px solid var(--raja);color:var(--hiili);font-weight:650;font-size:15px;padding:6px 4px}
.tilat button[data-t="ok"].on{background:var(--ok);border-color:var(--ok);color:#fff}
.tilat button[data-t="poikkeama"].on{background:var(--pk);border-color:var(--pk);color:#fff}
.tilat button[data-t="korjattu"].on{background:#B8860B;border-color:#B8860B;color:#fff}
.tilat.aiempi button[data-t="korjattu"].on{background:var(--ok);border-color:var(--ok)}
.tilat.aiempi button[data-t="ennallaan"].on{background:#B8860B;border-color:#B8860B;color:#fff}
.tilat.aiempi button[data-t="pahentunut"].on{background:var(--pk);border-color:var(--pk);color:#fff}
.lisa{margin-top:8px;display:grid;gap:8px}
.lisa .kuvaRivi{display:flex;gap:8px;align-items:center}
.lisa .kuvaRivi button{flex:0 0 auto}
.lisa .kuvaRivi .mut{flex:1}
.kaikkiOk{margin-bottom:10px;width:100%}
.aiempi .edel{font-size:13px;color:var(--mut);margin:-2px 0 6px}
.osioHuom{margin-top:12px}
/* sanelu */
.sanelu{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;min-width:0}
.sanelu .vali{grid-column:1/-1;color:#8A8A8A;font-style:italic;font-size:14px;line-height:1.35;padding:0 4px}
.sanelu .vali:empty{display:none}
button.mic{width:52px;height:52px;min-height:52px;padding:0;background:#fff;border:1px solid var(--havu);color:var(--havu);font-size:22px;line-height:1}
button.mic.on{background:#C62828;border-color:#C62828;color:#fff;animation:pulssi 1.3s infinite}
@keyframes pulssi{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}70%{box-shadow:0 0 0 12px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
@media (prefers-reduced-motion:reduce){button.mic.on{animation:none}.nuoli{transition:none}}
textarea.muistio{min-height:200px;line-height:1.45}
#saneluPalkki{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;background:#C62828;color:#fff;border:none;border-radius:999px;padding:0 20px;min-height:48px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#saneluPalkki[hidden]{display:none}
/* kuvat */
.kuvat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.kuvat figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--raja);background:#fff;cursor:pointer}
.kuvat img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.kuvat figcaption{font-size:11px;padding:3px 6px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* alapalkki */
.alapalkki{position:fixed;left:0;right:0;bottom:0;background:var(--havu-dk);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.alapalkki .lk{flex:1;min-width:0;font-size:13px;line-height:1.35}
.alapalkki .lk b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alapalkki button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);min-width:48px;padding:0 10px;font-size:18px}
.alapalkki button.t{background:var(--celadon);color:var(--luumu);border:none;padding:0 14px;font-size:15px;font-weight:700}
.alapalkki[hidden]{display:none}
dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 20px)}
dialog::backdrop{background:rgba(15,30,30,.5)}
dialog .dsis{padding:14px}
dialog h3{margin:0 0 10px;color:var(--havu)}
dialog img{width:100%;border-radius:10px;max-height:55vh;object-fit:contain;background:#000}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div><h1>Asemakierto</h1><div class="ala">Luotea · asemanhoidon tarkastuskäynti</div></div>
  <a class="ohje" href="ohje.html">Ohje</a>
  <div class="build">build 261110.2<div id="tallennettu"></div><div id="verkko"></div></div>
</header>

<main>
  <!-- etusivu -->
  <div id="nakymaAsemat">
    <div id="kesken"></div>
    <section class="kortti">
      <h2>Kävijä</h2>
      <div class="kentat">
        <label class="k">Nimi<input data-a-k="tekija" autocomplete="name"></label>
        <label class="k">Yritys<input data-a-k="yritys" placeholder="Luotea tai alihankkijan yritys"></label>
      </div>
      <p class="mut" style="margin-bottom:0">Täytetään kerran. Nimi ja yritys tulevat jokaiseen käyntiin.</p>
    </section>
    <section class="kortti">
      <h2>Asemat</h2>
      <input id="haku" class="haku" type="search" placeholder="Hae asemaa" hidden>
      <div id="asemaLista"></div>
      <div class="napit">
        <button class="l" id="lisaaAsema">+ Lisää asema</button>
      </div>
      <div class="napit">
        <button class="s" id="tuoAsemat">📥 Tuo asemalista</button>
        <button class="s" id="avaaKaynti">📂 Avaa käynti tiedostosta</button>
      </div>
      <p class="mut">Asemalista on vain tässä puhelimessa. Avaa käynti tiedostosta, kun sinulle on lähetetty edellisen kävijän käynti (esim. sijaisuus).</p>
    </section>
  </div>

  <!-- käynti -->
  <div id="nakymaKaynti" hidden></div>
</main>

<div class="alapalkki" id="alapalkki" hidden>
  <button id="takaisin" title="Asemat" aria-label="Asemat">‹</button>
  <div class="lk"><b id="palkkiNimi"></b><span id="palkkiTila"></span></div>
  <button id="kuvaPika" title="Ota kuva" aria-label="Ota kuva">📷</button>
  <button class="t" id="laheta">📤 Lähetä</button>
</div>
<button id="saneluPalkki" type="button" hidden>⏹ Lopeta sanelu</button>
<input type="file" id="kuvaInput" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="kuvaGalleria" accept="image/*" multiple hidden>
<input type="file" id="avaaInput" accept=".json,application/json" hidden>
<input type="file" id="tuoInput" accept=".json,.csv,.txt,application/json,text/csv" hidden>
<dialog id="dlg"><div class="dsis"><h3 id="dlgOts"></h3><div id="dlgTeksti"></div><div class="napit" id="dlgNapit"></div></div></dialog>

<script>
(() => {
'use strict';
const BUILD = '261110.2', SCHEMA = 1, TYOKALU = 'LuoteaAsemakierto', AVAIN = 'luotea_asemakierto_v1';
// Lähetyksen vastaanottaja (jaettu postilaatikko). Tyhjä = ei näytetä. Osoite ei ole salainen, joten se voi olla koodissa.
const VASTAANOTTAJA = '';

// ---------- TARKASTUSKOHDAT – LUONNOS ----------
// Korvataan Juntsan selvittämillä kohteilla. kausi: 'kaikki' tai lista ['talvi','kevät','kesä','syksy'].
// Kohdan id:tä ei saa vaihtaa käyttöönoton jälkeen: avoimet poikkeamat seuraavat sitä käynniltä toiselle.
const OSIOT = [
  { id: 'piha', nimi: 'Piha ja liikennealueet', kausi: 'kaikki', kohdat: [
    ['kulku', 'Kulkureitit ja myymälän edusta'], ['ajo', 'Ajo- ja pysäköintialueet'], ['roska', 'Irtoroskat piha-alueella'],
    ['reuna', 'Reunakivet ja korokkeet'], ['valo', 'Valaistus (havainto)']] },
  { id: 'mittari', nimi: 'Mittarikatos ja polttoainealue', kausi: 'kaikki', kohdat: [
    ['katos', 'Mittarikatoksen alue'], ['saareke', 'Mittarisaarekkeet ja roska-astiat'], ['paperi', 'Pyyhepaperit ja pesuvälineet'],
    ['imeytys', 'Imeytysaine saatavilla']] },
  { id: 'pesu', nimi: 'Pesu, ilma ja vesi', kausi: 'kaikki', kohdat: [
    ['imuri', 'Imurit ja niiden ympäristö'], ['ilma', 'Ilma- ja vesipiste'], ['halli', 'Pesuhallin edusta']] },
  { id: 'lataus', nimi: 'Latauspisteet', kausi: 'kaikki', kohdat: [['alue', 'Latausalue ja kulku laitteille']] },
  { id: 'jate', nimi: 'Jätehuolto', kausi: 'kaikki', kohdat: [
    ['piste', 'Jätepiste tai -katos'], ['taytto', 'Roska-astioiden täyttöaste'], ['kierratys', 'Kierrätyspiste']] },
  { id: 'talvi', nimi: 'Talvi', kausi: ['talvi'], kohdat: [
    ['auraus', 'Auraus ajo- ja pysäköintialueilla'], ['liukkaus', 'Kulkureittien liukkaudentorjunta'],
    ['katoslumi', 'Katosten ja räystäiden lumi ja jää'], ['lumitila', 'Lumitilat ja poisajon tarve']] },
  { id: 'kevat', nimi: 'Kevät', kausi: ['kevät'], kohdat: [['hiekka', 'Hiekoitushiekan poisto'], ['siivous', 'Kevätsiivous']] },
  { id: 'kesa', nimi: 'Viheralueet', kausi: ['kesä'], kohdat: [
    ['nurmi', 'Nurmikot'], ['istutus', 'Istutukset ja pensaat'], ['rikka', 'Rikkakasvit kiveyksillä']] },
  { id: 'syksy', nimi: 'Syksy', kausi: ['syksy'], kohdat: [['lehdet', 'Lehtien poisto'], ['talvikunto', 'Valmius talveen (aurausmerkit, hiekoitus)']] },
  { id: 'ymp', nimi: 'Ympäristö ja tekniikka', kausi: 'kaikki', kohdat: [['kaivot', 'Sadevesikaivot ja ritilät'], ['erotin', 'Öljynerottimen ympäristö (havainto)']] },
].map(o => ({ ...o, kohdat: o.kohdat.map(([id, nimi]) => ({ id, nimi, key: o.id + ':' + id })) }));
const KOHTA = Object.fromEntries(OSIOT.flatMap(o => o.kohdat.map(k => [k.key, { ...k, osio: o.nimi }])));
const KAUDET = ['talvi', 'kevät', 'kesä', 'syksy'];
const kausiKuusta = m => (m >= 11 || m <= 3) ? 'talvi' : m <= 5 ? 'kevät' : m <= 8 ? 'kesä' : 'syksy';
const osioKaudella = (o, k) => o.kausi === 'kaikki' || o.kausi.includes(k);
const TILA_NIMI = { ok: 'Kunnossa', poikkeama: 'Poikkeama', korjattu: 'Korjattu paikalla' };
const SEUR_NIMI = { korjattu: 'Korjattu', ennallaan: 'Ennallaan', pahentunut: 'Pahentunut' };

// ---------- apurit ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const p2 = n => String(n).padStart(2, '0');
const tanaan = () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
const kello = () => { const d = new Date(); return `${p2(d.getHours())}${p2(d.getMinutes())}`; };
const pvmFi = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? `${+m[3]}.${+m[2]}.${m[1]}` : (s || ''); };
const nimiOsa = s => String(s || '').normalize('NFC').replace(/[^A-Za-z0-9_\-åäöÅÄÖ]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
const lueTeksti = f => f.text ? f.text() : new Promise((ok, ei) => { const r = new FileReader(); r.onload = () => ok(String(r.result)); r.onerror = () => ei(r.error); r.readAsText(f); });  // vanha Safari
const getP = (o, p) => p.split('.').reduce((t, k) => (t == null ? undefined : t[k]), o);
function setP(o, p, v) { const a = p.split('.'); let t = o; for (let i = 0; i < a.length - 1; i++) { if (t[a[i]] == null || typeof t[a[i]] !== 'object') t[a[i]] = {}; t = t[a[i]]; } t[a[a.length - 1]] = v; }

// ---------- tila ----------
// A.asemat: [{id, nimi, numero, osoite, paikkakunta}]   A.historia: {asemaId: viimeisin valmis käynti ilman kuvia}
// A.kaynti: keskeneräinen käynti tai null (yksi kerrallaan)
const uusiTila = () => ({ v: SCHEMA, tekija: '', yritys: '', asemat: [], historia: {}, kaynti: null });
let A = uusiTila();  // ladataan alla, kun apufunktiot on määritelty
function normalisoi(d) {
  const t = uusiTila();
